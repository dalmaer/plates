name: plates-impact

# Managed by plates (practice reconciliation). The pull request's keel-impact
# declaration, checked against its actual diff. It is its own workflow so that
# editing the PR's description re-checks it in seconds; folding it into
# check.yml would mean a full gate on every edit, or a skipped gate whose
# result replaces a red one.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: plates-impact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  impact:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # The event file carries the description as it is now, so an edit
      # that fixes the declaration turns this check green.
      - run: node scripts/plates/reconcile.mjs --event "$GITHUB_EVENT_PATH" --json
