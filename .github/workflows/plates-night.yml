# The night (plates practice `night`; managed: plates render rewrites it).
#
# The night speaks up only when something is wrong (plates phase 207). Each
# night it asks three questions of the default branch, with improve.mjs's own
# measures run alone (scripts/plates/night-verdict.mjs):
#
#   - Is CI on main red? ci_red_streak: the gate workflow's newest verdicts on
#     main; and the gate measure, when it fails on main's tree (CI's result
#     for the exact clean commit, reused within 24 hours, else the local check).
#   - Is a test flaky? flaky_tests: a test that both passed and failed on one
#     clean tree, in the newest window of the test ledger's recorded runs.
#   - Did the gate run no tests? The gate measure: it passed having run none
#     (lesson 14).
#
# Any yes fails the run in its last step (exit 1), naming each cause with
# ::error:: and in the run's summary, and GitHub emails: a guard fires into a
# room someone is in. A measure that is broken (it could not read CI, the
# ledger or the gate) is red too, as "The night could not check": an unread
# source is unknown, never fine. Otherwise the run is green, with one summary
# line; a measure that does not apply (n/a) is said in the summary.
#
# It writes nothing: no branch, no pull request, no inbox proposal, no plan;
# the job's token only reads. Its one keepsake is the test ledger, carried
# from night to night as the plates-test-runs artifact, which flaky detection
# reads. Read-only production observation is kept as an artifact too, for
# plates-morning's brief. Every other measure, and the health page, is written
# on demand: `plates improve`, or `node scripts/plates/improve.mjs --report`.
#
# Optional Vercel collection uses VERCEL_API_TOKEN only in its collection step.
# A project whose `setup` must clone a private repo names a secret in
# .plates/plates.json "setupToken"; the Install step alone gets it, as GH_TOKEN.
name: plates-night

on:
  schedule:
    # 07:23 UTC, off the hour, so it does not queue behind every other cron.
    - cron: "23 7 * * *"
  workflow_dispatch:

concurrency:
  group: plates-night
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  night:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The whole history: the gate's reuse and the ledger read commits.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # The project's install, read from .plates/plates.json at run time (so a
      # config change never needs a re-render): `setup` when it has one, else
      # npm ci when a lockfile exists. Its `env` goes to every later step
      # (scripts/plates/improve.mjs applies it to the gate too), so a gate that
      # must not sync or push is told so before anything runs.
      # gh stores a helper, never the token; only read steps supply GH_TOKEN.
      - name: Configure authenticated Git reads
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git
      - name: Read the config
        id: config
        run: |
          node -e '
            const fs = require("fs");
            const c = JSON.parse(fs.readFileSync(".plates/plates.json", "utf8"));
            const env = c.env ?? {};
            if (!env || typeof env !== "object" || Array.isArray(env)) throw new Error(".plates/plates.json: \"env\" must be an object of NAME: \"value\"");
            if (c.setup !== undefined && (typeof c.setup !== "string" || !c.setup.trim())) throw new Error(".plates/plates.json: \"setup\" must be a non-empty shell command");
            const tok = c.setupToken;
            if (tok !== undefined && (typeof tok !== "string" || !/^[A-Z_][A-Z0-9_]*$/.test(tok) || tok.startsWith("GITHUB_") || c.setup === undefined)) throw new Error(".plates/plates.json: \"setupToken\" must name a repo secret (not GITHUB_*) and needs a \"setup\"");
            const eof = `PLATES_EOF_${Date.now()}`;
            const lines = [];
            for (const [k, v] of Object.entries(env)) {
              if (!/^[A-Z_][A-Z0-9_]*$/.test(k) || typeof v !== "string") throw new Error(`.plates/plates.json: "env" ${k} must be NAME: "value"`);
              lines.push(`${k}<<${eof}`, v, eof);
              console.log(`env: ${k}`);
            }
            if (lines.length) fs.appendFileSync(process.env.GITHUB_ENV, `${lines.join("\n")}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `setup<<${eof}\n${c.setup ?? ""}\n${eof}\n`);
            // Only the secret NAME, never its value: the Install step looks it up.
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `setup_token=${tok ?? ""}\n`);
            import("./scripts/plates/production-collectors.mjs").then(({ productionConfig }) => {
              const p = productionConfig(c);
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `production_vercel=${p.enabled && p.sources.some(s => s.provider === "vercel")}\n`);
            });
            if (tok) console.log(`setupToken: ${tok} (a repo secret, for the Install step only)`);
          '
      - name: Install
        # setupToken (a secret's name in .plates/plates.json) becomes GH_TOKEN here
        # and in no other step, so setup can clone a private repo with gh
        # (private data). Absent or unset, no token. Never echoed.
        env:
          SETUP: ${{ steps.config.outputs.setup }}
          GH_TOKEN: ${{ secrets[steps.config.outputs.setup_token] || '' }}
        run: |
          if [ -n "$SETUP" ]; then
            echo "setup (.plates/plates.json): $SETUP"
            bash -e -c "$SETUP"
          elif [ -f package-lock.json ]; then
            npm ci
          fi

      # Read-only production collection, restored from the newest enabled attempt.
      # The provider CLI/identity must be supplied by project setup. No model runs.
      - name: Collect production evidence
        id: production
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
          VERCEL_TOKEN: ${{ steps.config.outputs.production_vercel == 'true' && secrets.VERCEL_API_TOKEN || '' }}
        run: node scripts/plates/production-night.mjs

      - name: Retain production evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plates-production-${{ github.run_attempt }}
          path: ${{ runner.temp }}/plates-production/
          if-no-files-found: ignore
          retention-days: 90

      # The history flaky_tests reads: CI's plates-test-runs artifacts, bounded
      # and identity-verified; gaps remain visible.
      - name: Gather the test ledger
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          node scripts/plates/test-history.mjs --repo "$REPO" --branch "$BASE" --json

      # The three questions. The gate runs first, so its own run is in the
      # ledger flaky_tests reads. Nothing is written but the answers file.
      - name: Ask the three questions
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/plates/night-verdict.mjs ask --out "$RUNNER_TEMP/night.json"

      # For tomorrow night: the ledger persists between nights only as this
      # artifact (it is never committed). Tonight's gate receipt carries
      # bounded, redacted failure output; no raw logs are uploaded.
      - name: Keep the test ledger
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plates-test-runs
          # Explicit telemetry paths only: never upload local workaround transcripts.
          path: |
            .plates/test-runs/*.json
            .plates/test-runs/retention
            .plates/test-runs/recovery/status.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 56

      # The last step, and the night's only red: CI on main is red, a test is
      # flaky, the gate ran no tests, or the night could not check one of
      # them. Each cause is named.
      - name: Verdict
        run: node scripts/plates/night-verdict.mjs verdict --in "$RUNNER_TEMP/night.json" --summary "$GITHUB_STEP_SUMMARY"
