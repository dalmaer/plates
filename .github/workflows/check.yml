name: check

on:
  # main only: every other branch is checked through its pull request, and a
  # push to it as well would run the same gate twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconciliation:
    name: Reconcile GitHub records
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      producer_attempt: ${{ steps.observe.outputs.producer_attempt }}
      artifact_id: ${{ steps.archive.outputs.artifact-id }}
      artifact_digest: ${{ steps.archive.outputs.artifact-digest }}
      result_digest: ${{ steps.observe.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
      - name: Observe pull requests
        id: observe
        env:
          PLATES_RECONCILE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          PLATES_RECONCILE_TOKEN: ${{ secrets.PLATES_RECONCILE_TOKEN }}
        run: node scripts/plates/reconcile-actions.mjs --produce
      - name: Keep reconciliation result
        id: archive
        uses: actions/upload-artifact@v7
        with:
          name: plates-reconciliation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/result.json
          if-no-files-found: error
          retention-days: 1
      - name: Reconciliation verdict
        env:
          STATUS: ${{ steps.observe.outputs.status }}
        run: exit "$STATUS"

  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      # Read-only: the docs-only rule (scripts/plates/gate.mjs) reads which
      # commit CI last tested fully, and that run's plates-test-runs artifact.
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # The source gate executes compiler fixtures using pinned dev tooling.
      # Consumer setup remains the project's own; this adds no runtime dependency.
      - name: Install source test tooling
        run: |
          SELF=$(node -e 'const c=JSON.parse(require("fs").readFileSync(".plates/plates.json","utf8"));console.log(c.plates === "self" ? "true" : "false")')
          if [ "$SELF" = true ]; then
            npm ci --ignore-scripts
          fi
      # The roadmap is a VIEW of the phases; a stale view is how status came
      # to be written in two places that disagreed.
      # When night supplies the ledger, record the configured outer gate:
      # scripts/plates/gate.mjs --ci runs it through the ledger's launcher, or
      # records "skipped: docs only" for a commit that changes only
      # .plates/plates.json "delivery".docsOnly paths since the last fully tested
      # commit (never reusing a result: this run is the one others reuse).
      # CI-only adopters still run their check without that optional module.
      - name: Run the configured gate
        env:
          GH_TOKEN: ${{ github.token }}
          RECORD_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          RECORD_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          SELF=$(node -e 'const c=JSON.parse(require("fs").readFileSync(".plates/plates.json","utf8"));console.log(c.plates === "self" ? "true" : "false")')
          if [ "$SELF" = true ]; then
            node scripts/check-records.mjs --policy plates-source-records-v1 --base "$RECORD_BASE" --head "$RECORD_HEAD" --json
          elif [ -f scripts/plates/gate.mjs ]; then
            node scripts/plates/gate.mjs --ci
          elif [ -f scripts/plates/test-ledger.mjs ]; then
            node scripts/plates/test-ledger.mjs --gate
          else
            npm run check
          fi
      # The test ledger's record of this run (scripts/plates/test-ledger.mjs, the
      # night practice), kept as an artifact even when the check failed: the
      # night reads the newest ones on the default branch to say which test is
      # flaky or slower. A project without the reporter has nothing to keep.
      - name: Keep the test ledger
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plates-test-runs
          path: .plates/test-runs/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
      - name: Reconcile records (optional)
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if node -e 'const c=JSON.parse(require("fs").readFileSync(".plates/plates.json","utf8"));process.exit(c.practices.includes("reconciliation")?0:1)'; then
            node scripts/plates/reconcile.mjs --json
            # The PR's keel-impact declaration is plates-impact.yml's, so an
            # changed description is re-checked without re-running this gate.
          fi
